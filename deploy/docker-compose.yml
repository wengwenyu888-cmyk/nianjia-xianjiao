# 本地开发编排：backend + MySQL 8
# 使用：在仓库根目录执行 docker compose -f deploy/docker-compose.yml up -d
#      变量从 deploy/.env 读取（复制 deploy/.env.example 后填值）
name: nianjia-xianjiao-dev

services:
  mysql:
    image: mysql:8.0
    container_name: njxj-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置}
      MYSQL_DATABASE: ${DB_NAME:-nianjia_xianjiao}
      MYSQL_USER: ${DB_USER:-nianjia}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 中设置}
      TZ: Asia/Shanghai
    ports:
      # 只绑定本机，避免数据库意外暴露到局域网
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    container_name: njxj-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      DEBUG: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-nianjia}
      DB_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 中设置}
      DB_NAME: ${DB_NAME:-nianjia_xianjiao}
      # 开发环境密钥由 .env 提供，生产改用云密钥管理注入
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 deploy/.env 中设置}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    # 本地联调挂载源码并开热重载；生产镜像不挂载任何卷
    volumes:
      - ../backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  mysql-data:
    name: njxj-mysql-data
