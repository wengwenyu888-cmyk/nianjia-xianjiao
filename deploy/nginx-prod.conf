# ============================================================================
# 念家鲜饺供应链系统 —— 生产 nginx（单机形态）
# 挂载为 /etc/nginx/conf.d/default.conf，覆盖镜像自带示例配置
# 作用：托管 frontend-web/dist 静态资源 + 把 /api 反向代理到 backend:8000
# 校验：docker compose -f deploy/docker-compose.prod.yml exec nginx nginx -t
# ============================================================================

# 后端上游；keepalive 复用长连接，降低高并发/高延迟下的 TIME_WAIT 与握手开销
upstream nianjia_api {
    server backend:8000;
    keepalive 16;
}

# gzip 属于 http 上下文（conf.d 被 include 进 http 块），此处全局生效
# 门店端/司机端多为移动网络，文本类响应压缩收益最明显
gzip on;
gzip_comp_level 5;               # 5 是压缩率与 CPU 的平衡点，再高收益递减
gzip_min_length 1024;            # 小于 1KB 压缩后可能更大，直接跳过
gzip_proxied any;                # 后端响应也压缩（默认只压本机生成的响应）
gzip_vary on;                    # 告知 CDN/代理按 Accept-Encoding 分缓存
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
    listen 80 default_server;
    server_name _;               # 单机先用 IP 访问；绑定域名后替换为实际域名

    # 静态根目录 = nginx 容器内挂载的前端构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA（vue-router history 模式）：静态文件优先，未命中一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物可长期缓存；immutable 让浏览器跳过条件请求
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx 规则：location 内出现 add_header 后不再继承 server 级头部，故此处重复安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # 入口 HTML 绝不缓存，否则发版后用户仍加载旧资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # 后端接口反代：前端 VITE_API_BASE_URL=/api/v1，全部命中此处
    location /api/ {
        proxy_pass http://nianjia_api;
        proxy_http_version 1.1;                 # keepalive 上游必须是 HTTP/1.1
        proxy_set_header Connection "";         # 清掉 close，才能真正复用连接
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;               # 签收照片上传；与后端限制保持一致
    }

    # 预留：负载均衡/云监控直通后端存活探针（后端真实路径 /api/v1/health）
    # 单独成条，将来换独立 /health 实现或加来源 IP 白名单时不影响 /api/ 规则
    location = /health {
        access_log off;
        proxy_pass http://nianjia_api/api/v1/health;
        proxy_set_header Host $host;
    }

    # nginx 自身存活检查（供容器 healthcheck 使用，不产生访问日志）
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 安全响应头（always 保证错误响应也带）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
