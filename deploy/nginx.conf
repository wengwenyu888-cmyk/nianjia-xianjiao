# 前端静态托管 + /api 反向代理骨架（生产改由 COS + CDN 承载静态资源，此文件供单机形态使用）
# 校验：nginx -t -c /etc/nginx/conf.d/nianjia.conf

upstream nianjia_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 静态资源：frontend-web 的构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：非文件路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端接口反代
    location /api/ {
        proxy_pass http://nianjia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # 签收照片等上传：与后端限制保持一致
        client_max_body_size 20m;
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 容器健康检查
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
