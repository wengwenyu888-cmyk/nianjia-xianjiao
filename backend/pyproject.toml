[project]
name = "nianjia-xianjiao-backend"
version = "0.1.0"
description = "念家鲜饺供应链系统总部 API（要货 → 汇总 → 分拣 → 配送 → 签收 → 对账）"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    # Web 框架与 ASGI 服务器
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    # 数据校验与配置
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # ORM / 驱动 / 迁移
    "sqlalchemy>=2.0.35",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "alembic>=1.13.3",
    # HTTP 客户端（LLM / 银豹 / 金蝶）
    "httpx>=0.27.2",
    # 认证与口令
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    # 限流
    "slowapi>=0.1.9",
    # Excel 读写（台账导入导出、对账单导出）
    "openpyxl>=3.1.5",
]

[dependency-groups]
# 开发与 CI 依赖：uv 默认同步本组；生产装依赖用 uv sync --no-dev
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ------------------------------------------------------------------ 工具配置
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F 基础错误、I 导入排序、B bugbear、UP 现代化、N 命名、SIM 简化
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends/Query 默认值写法

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# 单人项目不宜过严：先只对 core / service / schema 做基础校验
files = ["app/core", "app/service", "app/schema"]
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*", "tests/*"]
